services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-healthguard}
      POSTGRES_USER: ${POSTGRES_USER:-healthguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-healthguard} -d ${POSTGRES_DB:-healthguard}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./api:/app/api:ro
      - ./src:/app/src:ro
      - ./models:/app/models:ro
      - ./data:/app/data:ro
    ports:
      - "${BIND_IP:-127.0.0.1}:8000:8000"
    networks:
      - backend

networks:
  backend: {}

volumes:
  postgres_data: {}
