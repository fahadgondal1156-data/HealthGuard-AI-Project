services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-healthguard}
      POSTGRES_USER: ${POSTGRES_USER:-healthguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U ${POSTGRES_USER:-healthguard} -d ${POSTGRES_DB:-healthguard}"]
      interval: 10s
      timeout: 5s
      retries: 10
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    env_file: .env
    depends_on:
      db: {condition: service_healthy}
    volumes:
      - ./models:/app/models:ro
      - ./data:/app/data:ro
    ports:
      - "127.0.0.1:8000:8000"
    networks: [backend,frontend]
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    restart: unless-stopped
    environment:
      API_BASE_URL: http://api:8000
    depends_on: [api]
    ports:
      - "127.0.0.1:8501:8501"
    networks: [frontend]
networks:
  backend: {}
  frontend: {}
volumes:
  postgres_data: {}
